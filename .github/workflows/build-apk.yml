name: Build Ionic Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      VITE_GOOGLE_WEB_CLIENT_ID: ${{ vars.VITE_GOOGLE_WEB_CLIENT_ID || secrets.VITE_GOOGLE_WEB_CLIENT_ID }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Check APK certificate comparison
        run: python3 -m unittest discover -s tests/native

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Google identifies Android apps by package AND signing certificate.
      # Reuse a configured debug key so its registered SHA-1 stays valid across builds.
      - name: Restore configured Android debug signing key
        id: signing
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Set the ANDROID_DEBUG_KEYSTORE_BASE64 repository secret to your registered Android debug keystore. See README.md → Android Google sign-in."
            exit 1
          fi
          task_manager_key_path="$RUNNER_TEMP/task-manager-signing/debug.keystore"
          mkdir -p "$(dirname "$task_manager_key_path")"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$task_manager_key_path"
          chmod 600 "$task_manager_key_path"
          keytool -J-Duser.language=en -list -v -keystore "$task_manager_key_path" -alias androiddebugkey -storepass android -keypass android > Android-signing-certificate.txt
          printf 'TASK_MANAGER_DEBUG_KEYSTORE=%s\n' "$task_manager_key_path" >> "$GITHUB_ENV"

      - name: Build web application and sync Capacitor Android
        run: npm run build:android

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify APK uses the configured signing certificate
        run: python3 scripts/verify-apk-signing.py android/app/build/outputs/apk/debug/app-debug.apk Android-signing-certificate.txt

      - name: Upload signing certificate information
        if: ${{ !cancelled() && steps.signing.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: Android signing certificate
          path: Android-signing-certificate.txt
          if-no-files-found: error
          retention-days: 30

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TaskManager.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Task Manager
          path: TaskManager.apk
          if-no-files-found: error
          retention-days: 30
